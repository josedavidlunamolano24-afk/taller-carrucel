<div class="max-w-3xl mx-auto bg-white shadow-lg rounded-xl p-8">

    <h2 class="text-3xl font-bold text-indigo-600 mb-8 text-center">
        Actualizar cliente
    </h2>

    <form
        (ngSubmit)="actualizarClient()"
        class="max-w-2xl mx-auto space-y-6">

        <div>
            <label class="block text-gray-700 font-semibold mb-2">
                NIT
            </label>

            <input
                type="text"
                placeholder="Ingrese el NIT"
                [(ngModel)]="client.nit"
                name="nit"
                required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-2">
                Nombre
            </label>

            <input
                type="text"
                placeholder="Ingrese el nombre"
                [(ngModel)]="client.nombre"
                name="nombre"
                required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-2">
                Teléfono
            </label>

            <input
                type="text"
                placeholder="Ingrese el teléfono"
                [(ngModel)]="client.telefono"
                name="telefono"
                required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>


        <div>
            <label class="block text-gray-700 font-semibold mb-2">
                Dirección
            </label>

            <input
                type="text"
                placeholder="Ingrese la dirección"
                [(ngModel)]="client.direccion"
                name="direccion"
                required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="flex justify-end gap-4 pt-4">


            <button
                type="submit"
                class="px-6 py-3 bg-indigo-600 text-white rounded-lg
                    font-semibold hover:bg-indigo-700 transition">
                Actualizar cliente
            </button>

        </div>

    </form>

</div>
