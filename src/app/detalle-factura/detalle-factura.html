<div class="mx-5 mt-5 bg-white shadow-md rounded-lg p-6 overflow-x-auto">

    <h2 class="text-2xl font-bold text-indigo-600 mb-6">
        DETALLE DE FACTURAS
    </h2>

    <table class="w-full table-auto border border-gray-200 rounded-lg overflow-hidden">

        <thead class="bg-indigo-100 text-indigo-600">

            <tr>
                <th class="p-3 border text-center"> ID </th>
                <th class="p-3 border text-center"> #NO FACTURA </th>
                <th class="p-3 border text-center"> CODIGO PRODUCTO </th>
                <th class="p-3 border text-center">CANTIDAD PEDIDA</th>
                <th class="p-3 border text-center"> PRECIO TOTAL </th>
            </tr>
        </thead>
        <tbody>

            <tr
                *ngFor="let detalle of detalles"
                class="hover:bg-gray-50">
                <td class="p-3 border text-center"> {{ detalle.id }} </td>
                <td class="p-3 border text-center"> {{ detalle.no_factura }} </td>
                <td class="p-3 border text-center"> {{ detalle.cod_producto }} </td>
                <td class="p-3 border text-center"> {{ detalle.cantidad_pedida }} </td>
                <td class="p-3 border text-center"> {{ detalle.precio_total }} </td>
            </tr>
        </tbody>
    </table>
</div>
