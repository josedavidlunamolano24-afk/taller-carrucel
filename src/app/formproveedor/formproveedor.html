<div class="max-w-3xl mx-auto bg-white shadow-lg rounded-xl p-8">

    <h2 class="text-3xl font-bold text-indigo-600 mb-8 text-center">
        Registro de Proveedor
    </h2>

    <form class="space-y-6">

        <!-- Nombre -->
        <div>
            <label class="block text-gray-700 font-semibold mb-2">
                Nombre
            </label>

            <input
                type="text"
                placeholder="Ingrese el nombre"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Teléfono -->
        <div>
            <label class="block text-gray-700 font-semibold mb-2">
                Teléfono
            </label>

            <input
                type="tel"
                placeholder="Ingrese el teléfono"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Dirección -->
        <div>
            <label class="block text-gray-700 font-semibold mb-2">
                Dirección
            </label>

            <input
                type="text"
                placeholder="Ingrese la dirección"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Botones -->
        <div class="flex justify-end gap-4 pt-4">

            <button
                type="reset"
                class="px-6 py-3 rounded-lg bg-gray-300 text-gray-700 hover:bg-gray-400 transition">
                Limpiar
            </button>

            <button
                type="submit"
                class="px-6 py-3 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition">
                Registrar proveedor
            </button>

        </div>

    </form>

</div>
