<div class="max-w-3xl mx-auto mt-8 bg-white shadow-md rounded-lg p-6">

  <div class="mb-6">

    <h2 class="text-2xl font-bold text-gray-800">
      Registrar factura
    </h2>

    <p class="text-gray-500 mt-1">
      Ingresa los datos de la nueva factura.
    </p>

  </div>


  <form class="space-y-5">

    <!-- FECHA -->

    <div>

      <label
        for="fecha"
        class="block text-sm font-medium text-gray-700 mb-2"
      >
        Fecha
      </label>

      <input
        id="fecha"
        type="date"
        name="fecha"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >

    </div>


    <!-- CLIENTE -->

    <div>

      <label
        for="cod_cliente"
        class="block text-sm font-medium text-gray-700 mb-2"
      >
        Código del cliente
      </label>

      <input
        id="cod_cliente"
        type="number"
        name="cod_cliente"
        min="1"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Ej: 1"
      >

    </div>


    <!-- TOTAL -->

    <div>

      <label
        for="total_factura"
        class="block text-sm font-medium text-gray-700 mb-2"
      >
        Total de la factura
      </label>

      <input
        id="total_factura"
        type="number"
        name="total_factura"
        min="0"
        step="0.01"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Ej: 80000"
      >

    </div>


    <!-- BOTONES -->

    <div class="flex justify-end gap-3 pt-4">

      <a
        routerLink="/factura"
        class="px-5 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100"
      >
        Cancelar
      </a>

      <button
        type="submit"
        class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700"
      >
        Guardar factura
      </button>

    </div>

  </form>

</div>
