<div class="mx-5 mt-5 bg-white shadow-md rounded-lg p-6 overflow-x-auto">

    <h2 class="text-2xl font-bold text-indigo-600 mb-6">
        Clientes
    </h2>

    <table class="w-full border border-gray-200 rounded-lg overflow-hidden">

    <thead class="bg-indigo-100 text-indigo-600">
        <tr>
            <th class="p-3 border">Código</th>
            <th class="p-3 border">NIT</th>
            <th class="p-3 border">Nombre</th>
            <th class="p-3 border">Teléfono</th>
            <th class="p-3 border">Dirección</th>
            <th class="p-3 border">opciones</th>
        </tr>
    </thead>

    <tbody>

        <tr
            *ngFor="let cliente of cliente"
            class="h-12 hover:bg-gray-50">

            <td class="border p-3">
                {{ cliente.cod_cliente }}
            </td>

            <td class="border p-3">
                {{ cliente.nit }}
            </td>

            <td class="border p-3">
                {{ cliente.nombre }}
            </td>

            <td class="border p-3">
                {{ cliente.telefono }}
            </td>

            <td class="border p-3">
                {{ cliente.direccion }}
            </td>

            <td class="border p-3">
                <div class="flex justify-center gap-2">

                    <button
                        type="button"
                        (click)="eliminar(cliente.cod_cliente)"
                        class="px-4 py-2 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600 transition">
                        Eliminar
                    </button>

                    <button
                        type="button"
                        (click)="ActualizarCliente(cliente.cod_cliente)"
                        class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition">
                        Actualizar
                    </button>

                </div>
            </td>

        </tr>



    </tbody>

    </table>

</div>
