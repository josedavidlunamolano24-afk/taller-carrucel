<div class="max-w-3xl mx-auto mt-8 bg-white shadow-md rounded-xl p-8">

    <h2 class="text-3xl font-bold text-indigo-600 mb-8 text-center">
        Registro de Cliente
    </h2>

    <form (ngSubmit)="guardarCliente()" class="space-y-6">


        <div>
            <label class="block text-gray-700 font-semibold mb-2">
                NIT
            </label>

            <input
                type="text"
                placeholder="Ingrese el NIT"
                [(ngModel)]="nuevoCliente.nit"
                name="nit"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>


        <div>
            <label class="block text-gray-700 font-semibold mb-2">
                Nombre
            </label>

            <input
                type="text"
                placeholder="Ingrese el nombre del cliente"
                [(ngModel)]="nuevoCliente.nombre"
                name="nombre"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>


        <div>
            <label class="block text-gray-700 font-semibold mb-2">
                Teléfono
            </label>

            <input
                type="tel"
                placeholder="Ingrese el teléfono"
                [(ngModel)]="nuevoCliente.telefono"
                name="telefono"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>


        <div>
            <label class="block text-gray-700 font-semibold mb-2">
                Dirección
            </label>

            <input
                type="text"
                placeholder="Ingrese la dirección"
                [(ngModel)]="nuevoCliente.direccion"
                name="direccion"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>


        <div class="flex justify-end gap-4 pt-4">

            <button
                type="submit"
                class="px-6 py-3 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition">
                Registrar cliente
            </button>

        </div>

    </form>
